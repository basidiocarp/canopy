[package]
name = "canopy"
version = "0.10.1"
edition = "2024"
rust-version = "1.85"
authors = ["William Newton"]
description = "Task-scoped coordination runtime for the Basidiocarp ecosystem"
license = "MIT"
repository = "https://github.com/basidiocarp/canopy"
keywords = ["basidiocarp", "agents", "orchestration", "cli", "coordination"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "canopy"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
glob = "0.3"
rusqlite = { version = "0.39", features = ["bundled"] }
rusqlite_migration = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
spore = { git = "https://github.com/basidiocarp/spore", rev = "85414a54afc16597297f6cd42edec5985474d767", features = ["otel"] }
strum = { version = "0.27", features = ["derive"] }
thiserror = "2"
tracing = "0.1"
ulid = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pre-existing pedantic violations to be addressed incrementally.
similar_names = "allow"
struct_field_names = "allow"
too_many_arguments = "allow"
too_many_lines = "allow"
type_complexity = "allow"
needless_pass_by_value = "allow"
unnecessary_wraps = "allow"
needless_borrow = "allow"
uninlined_format_args = "allow"
ref_option = "allow"
ignored_unit_patterns = "allow"
